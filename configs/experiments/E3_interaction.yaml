name: E3_interaction
analysis_family: E3a_category_by_roi_interaction
subject: 1
checkpoint_step: 100000
categories:
  Face: 37
  Body: 50
  Scene: 50
masked_rois:
  - Face
  - Body
  - Scene
mask_mode: mean
equal_k: 4
pure_control_overlap_threshold: 0.10
matched_random_controls: 5
seeds:
  - 12345
  - 23456
  - 34567
denoising_steps: 50
noise_factor: 4.0
condition_batch_size: 8
statistical_unit: image
seed_aggregation: mean_causal_loss_across_three_seeds_per_image
primary_model: metric_loss ~ image_category * masked_roi
primary_contrast: matched_image_category_minus_mean_nonmatched_categories
multiplicity: benjamini_hochberg_across_3_rois_x_5_global_metrics
nonmatched_category_weighting: equal_mean_of_the_two_nonmatched_categories
local_analysis: within_category_target_minus_same_roi_pure_random
local_multiplicity: benjamini_hochberg_across_3_categories_x_3_rois_x_3_local_metrics
global_metrics:
  - pixel_corr
  - ssim
  - lpips
  - clip
  - dino
local_metrics:
  Face:
    - face_lpips
    - face_dino
    - face_detection_success
  Body:
    - person_lpips
    - person_dino
    - person_region_consistency
  Scene:
    - background_dino
    - background_clip
    - scene_class_consistency
face_detector:
  backend: opencv_haar_e1
  cascade_filename: haarcascade_frontalface_default.xml
  cascade_sha256: 0f7d4527844eb514d4a4948e822da90fbb16a34a0bbbbc6adc6498747a5aafb0
  scale_factor: 1.1
  min_neighbors: 5
  min_size:
    - 24
    - 24
  pilot_fallback_allowed: false
  formal_fallback_allowed: false
execution:
  smoke_images_per_category: 1
  smoke_seeds: 1
  pilot_images_per_category: 10
  pilot_seeds: 1
  formal_requires_all_frozen_images: true
  formal_requires_all_seeds: true
