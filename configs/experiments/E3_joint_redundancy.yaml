name: E3_joint_redundancy
analysis_family: E3b_joint_roi_redundancy
subject: 1
checkpoint_step: 100000
categories:
  Face: 37
  Body: 50
  Scene: 50
joint_masks:
  - matched_single_roi
  - Face+Body
  - Face+Scene
  - Body+Scene
  - Face+Body+Scene
mask_mode: mean
equal_k: 4
pure_control_overlap_threshold: 0.10
matched_random_controls: 5
seeds:
  - 12345
  - 23456
  - 34567
denoising_steps: 50
noise_factor: 4.0
condition_batch_size: 8
statistical_unit: image
seed_aggregation: mean_causal_loss_across_three_seeds_per_image
primary_contrast: joint_target_minus_mean_same_count_pure_random
global_multiplicity: benjamini_hochberg_across_3_categories_x_5_masks_x_5_global_metrics
local_multiplicity: benjamini_hochberg_across_3_categories_x_5_masks_x_3_local_metrics
monotonicity:
  levels:
    - matching_single_roi_4_parcels
    - mean_of_two_matching_containing_double_roi_masks_8_parcels
    - Face+Body+Scene_12_parcels
  per_image_statistic: least_squares_slope_across_levels_1_2_3
  test: two_sided_sign_flip
  global_multiplicity: benjamini_hochberg_across_3_categories_x_5_global_metrics
  local_multiplicity: benjamini_hochberg_across_3_categories_x_3_local_metrics
global_metrics:
  - pixel_corr
  - ssim
  - lpips
  - clip
  - dino
local_metrics:
  Face:
    - face_lpips
    - face_dino
    - face_detection_success
  Body:
    - person_lpips
    - person_dino
    - person_region_consistency
  Scene:
    - background_dino
    - background_clip
    - scene_class_consistency
face_detector:
  backend: opencv_haar_e1
  cascade_filename: haarcascade_frontalface_default.xml
  cascade_sha256: 0f7d4527844eb514d4a4948e822da90fbb16a34a0bbbbc6adc6498747a5aafb0
  scale_factor: 1.1
  min_neighbors: 5
  min_size:
    - 24
    - 24
  pilot_fallback_allowed: false
  formal_fallback_allowed: false
execution:
  smoke_images_per_category: 1
  smoke_seeds: 1
  pilot_images_per_category: 10
  pilot_seeds: 1
  formal_requires_all_frozen_images: true
  formal_requires_all_seeds: true
